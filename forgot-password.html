<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f33">
  <title>FLEXDESK | Reset Password</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #203b31; background: linear-gradient(135deg, #eef5ef, #e5eee8); font-family: Inter, "Segoe UI", sans-serif; }
    main { width: min(100%, 420px); padding: 38px; border: 1px solid #e0e9e2; border-radius: 18px; background: #fff; box-shadow: 0 24px 70px #173f331c; }
    .brand { display: flex; align-items: center; gap: 12px; color: #173f33; font-size: 19px; font-weight: 850; letter-spacing: .09em; }
    .mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 11px; color: white; background: #173f33; font-size: 21px; }
    .subbrand { display: block; margin-top: 3px; color: #829188; font-size: 9px; letter-spacing: .13em; }
    h1 { margin: 30px 0 7px; font-size: 27px; letter-spacing: -.04em; }
    p { color: #76857d; font-size: 13px; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; color: #40584b; font-size: 11px; font-weight: 800; }
    input { width: 100%; min-height: 45px; padding: 11px 13px; border: 1px solid #d5e0d8; border-radius: 9px; color: #243e32; background: #fcfdfc; font: inherit; }
    button { width: 100%; min-height: 46px; margin-top: 22px; border: 0; border-radius: 9px; color: white; background: #173f33; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    .message { min-height: 18px; margin: 12px 0 0; color: #ad3b3b; font-size: 12px; }
    .requirements { margin: 7px 0 0; color: #718079; font-size: 11px; line-height: 1.5; }
    .requirements[hidden] { display: none; }
    a { display: block; margin-top: 16px; color: #28664f; font-size: 12px; font-weight: 700; text-align: center; text-decoration: none; }
    @media (max-width: 480px) { main { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">F</span><span>FLEXDESK<small class="subbrand">SMART WORKSPACE SYSTEM</small></span></div>
    <h1>Reset password</h1>
    <p>Enter your Emp ID to continue.</p>
    <form id="resetForm">
      <label for="employeeId">Emp ID</label>
      <input id="employeeId" name="employeeId" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="username" required>
      <div id="newPasswordWrap" hidden>
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,256}">
        <p class="requirements">At least 8 characters, including an uppercase letter, a lowercase letter, a number and a special character.</p>
      </div>
      <button id="submitButton" type="submit">Generate new password</button>
      <p class="message" id="message" role="alert" aria-live="polite"></p>
    </form>
    <a href="/login.html">Back to sign in</a>
  </main>
  <script>
    const API = 'http://127.0.0.1:8002/api/v1';
    const form = document.querySelector('#resetForm');
    const wrap = document.querySelector('#newPasswordWrap');
    const password = document.querySelector('#newPassword');
    const button = document.querySelector('#submitButton');
    const message = document.querySelector('#message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';
      try {
        const body = { employee_id: form.elements.employeeId.value.trim() };
        if (!/^[0-9]{5}$/.test(body.employee_id)) throw new Error('Emp ID must be exactly 5 digits.');
        if (wrap.hidden) {
          const response = await fetch(`${API}/auth/password/reset`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || 'Emp ID not found.');
          wrap.hidden = false;
          password.required = true;
          button.textContent = 'Save new password';
          password.focus();
          return;
        }
        if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,256}$/.test(password.value)) {
          throw new Error('Password must be at least 8 characters and include an uppercase letter, a lowercase letter, a number and a special character.');
        }
        body.password = password.value;
        const response = await fetch(`${API}/auth/password/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Unable to update password.');
        window.location.replace('/login.html?updated=1');
      } catch (error) {
        message.textContent = error instanceof Error ? error.message : 'Unable to reset password.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
