<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f33">
  <title>FLEXDESK | Admin</title>
  <style>
    :root { font-family: Inter, "Segoe UI", sans-serif; color: #203b31; background: #f4f7f4; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 17px clamp(20px, 5vw, 76px); color: #fff; background: #173f33; }
    .brand { font-weight: 850; letter-spacing: .1em; }
    .brand small { display: block; margin-top: 4px; color: #bdd0c5; font-size: 9px; letter-spacing: .14em; }
    .topbar a, .topbar button { padding: 10px 15px; border: 1px solid #ffffff55; border-radius: 9px; color: #fff; background: transparent; font: inherit; font-size: 12px; font-weight: 750; text-decoration: none; cursor: pointer; }
    main { width: min(1440px, calc(100% - 40px)); margin: 36px auto; }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .heading p { margin: 0 0 8px; color: #638073; font-size: 11px; font-weight: 800; letter-spacing: .13em; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 38px); letter-spacing: -.045em; }
    .heading span { color: #718079; font-size: 13px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; }
    .tab { padding: 11px 16px; border: 1px solid #dce6df; border-radius: 9px 9px 0 0; color: #52685b; background: #fff; font: inherit; font-size: 12px; font-weight: 750; cursor: pointer; white-space: nowrap; }
    .tab[aria-selected="true"] { border-color: #173f33; color: #fff; background: #173f33; }
    .panel { overflow: hidden; border: 1px solid #e1e9e3; border-radius: 0 14px 14px; background: #fff; box-shadow: 0 12px 40px #173f330a; }
    .filters { display: flex; align-items: end; gap: 12px; padding: 18px; border-bottom: 1px solid #eaf0eb; flex-wrap: wrap; }
    .filter { display: grid; gap: 6px; min-width: 140px; flex: 1; }
    .filter label { color: #697a70; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .filter input, .filter select { width: 100%; min-height: 39px; padding: 8px 10px; border: 1px solid #dce6df; border-radius: 8px; color: #203b31; background: #fff; font: inherit; font-size: 12px; }
    .filters button { min-height: 39px; padding: 0 17px; border: 0; border-radius: 8px; color: #fff; background: #267251; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th { padding: 12px 15px; color: #718079; background: #f8faf8; font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    td { padding: 13px 15px; border-top: 1px solid #edf1ee; color: #40584b; font-size: 12px; }
    .empty, .error { padding: 30px; color: #718079; font-size: 13px; text-align: center; }
    .error { color: #ad3b3b; }
    .notice { margin: 0 0 13px; color: #718079; font-size: 11px; }
    @media (max-width: 600px) { main { width: calc(100% - 24px); margin: 22px auto; } .topbar { padding: 14px 16px; } .heading { align-items: start; flex-direction: column; } .tabs { margin-right: -12px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="FLEXDESK home">FLEXDESK<small>SMART WORKSPACE SYSTEM</small></a>
    <button id="logout" type="button">Logout</button>
  </header>
  <main>
    <section class="heading"><div><p>CONTROL CENTER</p><h1>Administration</h1></div><span id="adminName">Administrator access</span></section>
    <nav class="tabs" aria-label="Admin data views">
      <button class="tab" data-view="employees" aria-selected="true">Employees</button>
      <button class="tab" data-view="bookings" aria-selected="false">All Bookings</button>
      <button class="tab" data-view="login-history" aria-selected="false">Login History</button>
      <button class="tab" data-view="workspaces" aria-selected="false">Workspaces</button>
    </nav>
    <section class="panel">
      <form class="filters" id="filters"></form>
      <p class="notice" id="notice"></p>
      <div class="table-wrap" id="table"></div>
    </section>
  </main>
  <script>
    const API = 'http://127.0.0.1:8002/api/v1';
    const token = sessionStorage.getItem('flexdesk_token');
    const table = document.querySelector('#table');
    const filters = document.querySelector('#filters');
    const notice = document.querySelector('#notice');
    const columns = {
      employees: [['employee_id', 'Emp ID'], ['name', 'Name'], ['email', 'Email'], ['department', 'Department'], ['role', 'Role'], ['created_at', 'Created']],
      bookings: [['employee_id', 'Emp ID'], ['location', 'Location'], ['floor', 'Floor'], ['bay', 'Bay'], ['booking_type', 'Booking Type'], ['workspace', 'Desk or Room'], ['date', 'Date'], ['from', 'From'], ['to', 'To'], ['lunch', 'Lunch'], ['snacks', 'Snacks'], ['status', 'Status']],
      'login-history': [['employee_id', 'Emp ID'], ['event', 'Event'], ['created_at', 'Date and Time']],
      workspaces: [['location', 'Location'], ['floor', 'Floor'], ['bay', 'Bay'], ['bay_type', 'Bay Type'], ['workspace', 'Desk or Room'], ['workspace_type', 'Type'], ['capacity', 'Capacity'], ['status', 'Status']]
    };
    let activeView = 'employees';

    function escapeHtml(value) {
      return String(value ?? '—').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    }

    function renderFilters() {
      const fields = [
        ['employee_id', 'Emp ID', 'text', 'e.g. 12345'],
        ['location', 'Location', 'text', 'Location name'],
        ['floor', 'Floor', 'text', 'Floor name'],
        ['date', 'Date', 'date', ''],
        ['status', 'Status', 'text', 'Booking status']
      ];
      const enabled = activeView === 'bookings'
        ? ['employee_id', 'location', 'floor', 'date', 'status']
        : activeView === 'employees' ? ['employee_id']
        : activeView === 'login-history' ? ['employee_id', 'date', 'status']
        : ['location', 'floor'];
      filters.innerHTML = `${fields.filter(([key]) => enabled.includes(key)).map(([key, label, type, placeholder]) =>
        `<div class="filter"><label for="filter-${key}">${label}</label><input id="filter-${key}" name="${key}" type="${key === 'date' ? 'date' : type}" placeholder="${placeholder}"></div>`
      ).join('')}<button type="submit">Apply filters</button>`;
    }

    function renderRows(items) {
      if (!items.length) {
        table.innerHTML = '<div class="empty">No records found for these filters.</div>';
        return;
      }
      const viewColumns = columns[activeView];
      table.innerHTML = `<table><thead><tr>${viewColumns.map(([, label]) => `<th>${label}</th>`).join('')}</tr></thead><tbody>${items.map((item) =>
        `<tr>${viewColumns.map(([key]) => `<td>${escapeHtml(item[key])}</td>`).join('')}</tr>`
      ).join('')}</tbody></table>`;
    }

    async function loadData() {
      table.innerHTML = '<div class="empty">Loading records…</div>';
      const params = new URLSearchParams();
      for (const [key, value] of new FormData(filters)) {
        if (!value) continue;
        params.set(key === 'date' ? (activeView === 'login-history' ? 'event_date' : 'booking_date') : key === 'status' && activeView === 'login-history' ? 'event' : key, value);
      }
      try {
        const response = await fetch(`${API}/admin/${activeView}?${params}`, { headers: { Authorization: `Bearer ${token}` } });
        if (response.status === 401) {
          sessionStorage.removeItem('flexdesk_token');
          sessionStorage.removeItem('flexdesk_user');
          window.location.replace('/login.html');
          return;
        }
        if (response.status === 403) {
          window.location.replace('/');
          return;
        }
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Unable to load admin data.');
        if (activeView === 'bookings') notice.textContent = 'Lunch and snacks are not fields in the existing booking records and are shown as —.';
        else notice.textContent = '';
        renderRows(result);
      } catch (error) {
        table.innerHTML = `<div class="error">${escapeHtml(error.message || 'Unable to load admin data.')}</div>`;
      }
    }

    document.querySelectorAll('.tab').forEach((button) => button.addEventListener('click', () => {
      activeView = button.dataset.view;
      document.querySelectorAll('.tab').forEach((tab) => tab.setAttribute('aria-selected', String(tab === button)));
      renderFilters();
      loadData();
    }));
    filters.addEventListener('submit', (event) => { event.preventDefault(); loadData(); });
    document.querySelector('#logout').addEventListener('click', async () => {
      try {
        const response = await fetch(`${API}/auth/logout`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) throw new Error('The server could not record logout.');
      } catch (error) {
        window.alert(error.message || 'The server could not record logout.');
      } finally {
        sessionStorage.removeItem('flexdesk_token');
        sessionStorage.removeItem('flexdesk_user');
        window.location.replace('/login.html');
      }
    });

    async function initialize() {
      if (!token) {
        window.location.replace('/login.html');
        return;
      }
      const response = await fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (!response.ok) {
        sessionStorage.removeItem('flexdesk_token');
        sessionStorage.removeItem('flexdesk_user');
        window.location.replace('/login.html');
        return;
      }
      const user = await response.json();
      if (user.role !== 'admin') {
        window.location.replace('/');
        return;
      }
      document.querySelector('#adminName').textContent = user.name || 'Administrator access';
      renderFilters();
      loadData();
    }
    initialize().catch(() => window.location.replace('/login.html'));
  </script>
</body>
</html>
