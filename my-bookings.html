<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f33">
  <title>FLEXDESK | My Bookings</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #173436;
      background: #f3f7f5;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    .topbar { display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 12px max(20px, calc((100vw - 1120px) / 2)); color: white; background: #173f33; }
    .brand { font-size: 15px; font-weight: 850; letter-spacing: .16em; }
    .subbrand { color: #c8e4d9; font-size: 12px; }
    .home-link { margin-left: auto; color: #e9f4ef; font-size: 12px; font-weight: 750; }
    main { max-width: 1120px; margin: 0 auto; padding: 48px 20px 70px; }
    .eyebrow { color: #57816e; font-size: 10px; font-weight: 850; letter-spacing: .16em; }
    h1 { margin: 8px 0; color: #183c32; font-size: clamp(30px, 5vw, 42px); letter-spacing: -.045em; }
    .intro { margin: 0; color: #70817a; font-size: 14px; line-height: 1.6; }
    .tabs { display: flex; gap: 6px; margin: 28px 0 18px; padding: 5px; width: fit-content; border: 1px solid #d9e5df; border-radius: 12px; background: white; }
    .tab { min-width: 112px; padding: 10px 15px; border: 0; border-radius: 8px; color: #65766e; background: transparent; font-size: 12px; font-weight: 800; }
    .tab[aria-selected="true"] { color: white; background: #247456; box-shadow: 0 4px 10px #184e3b26; }
    .alert { margin: 0 0 16px; padding: 12px 14px; border: 1px solid #e5b6b6; border-radius: 10px; color: #873b3b; background: #fff3f2; font-size: 12px; }
    .alert[hidden] { display: none; }
    .booking-list { display: grid; gap: 14px; }
    .booking-card { overflow: hidden; border: 1px solid #dfe9e4; border-radius: 15px; background: #fff; box-shadow: 0 8px 24px #1a46300c; }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px 19px; border-bottom: 1px solid #edf2ef; }
    .space-name { min-width: 0; color: #183d32; font-size: 16px; font-weight: 850; overflow-wrap: anywhere; }
    .status { flex: none; padding: 6px 10px; border-radius: 999px; color: #286848; background: #e5f4e9; font-size: 10px; font-weight: 850; }
    .status.cancelled { color: #8a4a49; background: #f9e9e8; }
    .status.completed { color: #65736e; background: #edf1ef; }
    .details { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px 20px; padding: 18px 19px; }
    .detail { min-width: 0; }
    .detail dt { margin-bottom: 5px; color: #7a8982; font-size: 9px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .detail dd { margin: 0; color: #314a40; font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
    .card-actions { display: flex; justify-content: flex-end; padding: 0 19px 16px; }
    .cancel { padding: 8px 12px; border: 1px solid #e1b6b4; border-radius: 8px; color: #963e3d; background: white; font-size: 11px; font-weight: 800; }
    .cancel:hover { background: #fff3f2; }
    .empty { padding: 38px 20px; border: 1px dashed #cddbd4; border-radius: 14px; color: #718078; background: #fff; text-align: center; font-size: 13px; }
    .empty strong { display: block; margin-bottom: 7px; color: #315344; font-size: 16px; }
    @media (max-width: 650px) {
      .topbar { gap: 10px; padding-inline: 16px; }
      .details { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 15px; }
      .card-heading { padding: 15px; }
      .card-actions { padding-inline: 15px; }
      main { padding: 34px 14px 50px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">FLEXDESK</a>
    <span class="subbrand">Smart Workspace System</span>
    <a class="home-link" href="/">← Home</a>
  </header>
  <main>
    <span class="eyebrow">YOUR WORKSPACE, ALL IN ONE PLACE</span>
    <h1>My Bookings</h1>
    <p class="intro">Review upcoming workdays, revisit your booking history, or cancel an upcoming workspace.</p>
    <div class="tabs" role="tablist" aria-label="Booking views">
      <button class="tab" id="upcomingTab" type="button" role="tab" aria-selected="true" aria-controls="bookingList">Upcoming</button>
      <button class="tab" id="historyTab" type="button" role="tab" aria-selected="false" aria-controls="bookingList">History</button>
    </div>
    <p class="alert" id="storageError" role="alert" hidden></p>
    <section class="booking-list" id="bookingList" role="tabpanel" aria-live="polite"></section>
  </main>
  <script>
    "use strict";
    const STORAGE_KEY = "flexdesk_bookings";
    const list = document.querySelector("#bookingList");
    const error = document.querySelector("#storageError");
    const tabs = { upcoming: document.querySelector("#upcomingTab"), history: document.querySelector("#historyTab") };
    let activeView = "upcoming";
    let bookings = [];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    }
    function loadBookings() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error("Saved booking data is invalid.");
      return parsed;
    }
    function saveBookings(value) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    }
    function bookingEnd(booking) {
      return new Date(`${booking.date}T${booking.to || "23:59"}:00`);
    }
    function isUpcoming(booking, now = new Date()) {
      return booking.status !== "cancelled" && bookingEnd(booking) >= now;
    }
    function formatDate(value) {
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }
    function displayStatus(booking, upcoming) {
      if (booking.status === "cancelled") return "Cancelled";
      return upcoming ? "Confirmed" : "Completed";
    }
    function render() {
      const upcoming = activeView === "upcoming";
      const visible = bookings.filter((booking) => upcoming ? isUpcoming(booking) : !isUpcoming(booking));
      tabs.upcoming.setAttribute("aria-selected", String(upcoming));
      tabs.history.setAttribute("aria-selected", String(!upcoming));
      if (!visible.length) {
        list.innerHTML = `<div class="empty"><strong>${upcoming ? "No upcoming bookings" : "No booking history yet"}</strong>${upcoming ? "Once you book a workspace, it will appear here." : "Past and cancelled bookings will be collected here."}</div>`;
        return;
      }
      list.innerHTML = visible.slice().sort((a, b) => `${a.date}T${a.from}`.localeCompare(`${b.date}T${b.from}`)).map((booking) => {
        const isNext = isUpcoming(booking);
        const status = displayStatus(booking, isNext);
        const addons = [booking.lunch && "Lunch", booking.snacks && "Snacks"].filter(Boolean).join(", ") || "None";
        const space = booking.type === "Desk" ? booking.name || booking.id : booking.name || booking.id;
        const details = [
          ["Location", booking.location],
          ["Floor", booking.floor],
          ["Bay", booking.bay],
          ["Booking Type", booking.bookingType || booking.type],
          ["Desk / Room", space],
          ["Date", formatDate(booking.date)],
          ["From", booking.from],
          ["To", booking.to],
          ["Lunch", booking.lunch ? "Yes" : "No"],
          ["Snacks", booking.snacks ? "Yes" : "No"]
        ];
        return `<article class="booking-card">
          <div class="card-heading"><strong class="space-name">${escapeHtml(space)}</strong><span class="status ${status.toLowerCase()}">${escapeHtml(status)}</span></div>
          <dl class="details">${details.map(([label, value]) => `<div class="detail"><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value || "—")}</dd></div>`).join("")}</dl>
          ${isNext ? `<div class="card-actions"><button class="cancel" type="button" data-cancel="${escapeHtml(booking.bookingId)}">Cancel booking</button></div>` : ""}
        </article>`;
      }).join("");
      list.querySelectorAll("[data-cancel]").forEach((button) => button.addEventListener("click", () => cancelBooking(button.dataset.cancel)));
    }
    function cancelBooking(bookingId) {
      const booking = bookings.find((item) => item.bookingId === bookingId);
      if (!booking || !isUpcoming(booking)) return;
      const nextBookings = bookings.map((item) => item.bookingId === bookingId ? { ...item, status: "cancelled", cancelledAt: new Date().toISOString() } : item);
      try {
        saveBookings(nextBookings);
        bookings = nextBookings;
        error.hidden = true;
        render();
      } catch (saveError) {
        error.textContent = `Could not cancel this booking: ${saveError.message}`;
        error.hidden = false;
      }
    }
    function setView(view) {
      activeView = view;
      render();
    }
    tabs.upcoming.addEventListener("click", () => setView("upcoming"));
    tabs.history.addEventListener("click", () => setView("history"));
    window.addEventListener("storage", (event) => {
      if (event.key !== STORAGE_KEY && event.key !== null) return;
      try {
        bookings = loadBookings();
        error.hidden = true;
        render();
      } catch (loadError) {
        error.textContent = `Could not load saved bookings: ${loadError.message}`;
        error.hidden = false;
      }
    });
    try {
      bookings = loadBookings();
      render();
    } catch (loadError) {
      error.textContent = `Could not load saved bookings: ${loadError.message}`;
      error.hidden = false;
      list.innerHTML = "";
    }
  </script>
</body>
</html>
