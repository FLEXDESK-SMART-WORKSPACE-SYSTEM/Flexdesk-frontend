<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f33">
  <title>FLEXDESK | Login</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #203b31; background: linear-gradient(135deg, #eef5ef, #e5eee8); font-family: Inter, "Segoe UI", sans-serif; }
    .login-card { width: min(100%, 420px); padding: 38px; border: 1px solid #e0e9e2; border-radius: 18px; background: #fff; box-shadow: 0 24px 70px #173f331c; }
    .brand { display: flex; align-items: center; gap: 12px; color: #173f33; font-size: 19px; font-weight: 850; letter-spacing: .09em; }
    .mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 11px; color: white; background: #173f33; font-size: 21px; }
    .subbrand { display: block; margin-top: 3px; color: #829188; font-size: 9px; letter-spacing: .13em; }
    h1 { margin: 30px 0 7px; font-size: 27px; letter-spacing: -.04em; }
    .intro { margin: 0 0 25px; color: #76857d; font-size: 13px; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; color: #40584b; font-size: 11px; font-weight: 800; }
    input { width: 100%; min-height: 45px; padding: 11px 13px; border: 1px solid #d5e0d8; border-radius: 9px; color: #243e32; background: #fcfdfc; font: inherit; }
    input:focus { border-color: #398566; outline: 3px solid #39856622; }
    button { width: 100%; min-height: 46px; margin-top: 22px; border: 0; border-radius: 9px; color: #fff; background: #173f33; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
    button:hover { background: #28664f; }
    button:disabled { cursor: wait; opacity: .65; }
    .mode-button { min-height: 36px; margin-top: 8px; color: #28664f; background: transparent; font-size: 12px; }
    .mode-button:hover { color: #173f33; background: #f1f6f2; }
    .admin-mode-button { min-height: 38px; margin-top: 10px; border: 1px solid #d8e4dc; color: #28664f; background: #f7faf7; }
    .admin-mode-button:hover { border-color: #a9c6b5; background: #edf5ef; }
    .forgot-link { margin: 14px 0 0; font-size: 12px; text-align: center; }
    .forgot-link a { color: #28664f; font-weight: 700; text-decoration: none; }
    .error { min-height: 18px; margin: 12px 0 0; color: #ad3b3b; font-size: 12px; }
    .error.success { color: #287e62; }
    .requirements { margin: 7px 0 0; color: #718079; font-size: 11px; line-height: 1.5; }
    .requirements[hidden] { display: none; }
    @media (max-width: 480px) { .login-card { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand"><span class="mark">F</span><span>FLEXDESK<small class="subbrand">SMART WORKSPACE SYSTEM</small></span></div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to find and manage your workspace.</p>
    <form id="loginForm">
      <label for="employeeId">Emp ID</label>
      <input id="employeeId" name="employeeId" autocomplete="username" required>
      <label for="password" id="passwordLabel">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <p class="requirements" id="passwordRequirements" hidden>Password must be at least 8 characters and include an uppercase letter, a lowercase letter, a number and a special character.</p>
      <button id="submitButton" type="submit">Sign in</button>
      <button id="modeButton" class="mode-button" type="button">Create password</button>
      <p class="forgot-link"><a href="/forgot-password.html">Forgot password?</a></p>
      <button id="adminModeButton" class="admin-mode-button" type="button">Login as Admin</button>
      <button id="employeeModeButton" class="mode-button" type="button" hidden>Back to employee login</button>
      <p class="error" id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const API = 'http://127.0.0.1:8002/api/v1';
    const form = document.querySelector('#loginForm');
    const message = document.querySelector('#message');
    const passwordLabel = document.querySelector('#passwordLabel');
    const passwordInput = document.querySelector('#password');
    const passwordRequirements = document.querySelector('#passwordRequirements');
    const button = document.querySelector('#submitButton');
    const modeButton = document.querySelector('#modeButton');
    const adminModeButton = document.querySelector('#adminModeButton');
    const employeeModeButton = document.querySelector('#employeeModeButton');
    const employeeIdInput = document.querySelector('#employeeId');
    const heading = document.querySelector('h1');
    const intro = document.querySelector('.intro');
    const forgotLink = document.querySelector('.forgot-link');
    const params = new URLSearchParams(window.location.search);
    let createMode = false;
    let adminMode = false;
    localStorage.removeItem('flexdesk_token');
    localStorage.removeItem('flexdesk_user');
    if (params.get('created') === '1') {
      message.textContent = 'Password created. Please sign in.';
      message.classList.add('success');
    }
    if (params.get('updated') === '1') {
      message.textContent = 'Password updated. Please sign in.';
      message.classList.add('success');
    }
    if (params.get('error') === 'session') message.textContent = 'Your session expired. Please sign in again.';
    if (params.has('sso_error')) message.textContent = 'Single sign-on could not be completed. Sign in with your employee ID and password.';

    function enablePasswordCreation() {
      createMode = true;
      passwordLabel.textContent = 'Create password';
      passwordInput.value = '';
      passwordInput.autocomplete = 'new-password';
      passwordInput.minLength = 8;
      passwordInput.required = true;
      passwordInput.pattern = '(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,256}';
      passwordRequirements.hidden = false;
      button.textContent = 'Save password';
      modeButton.textContent = 'Back to sign in';
      message.textContent = '';
    }

    function enableSignIn() {
      createMode = false;
      passwordLabel.textContent = 'Password';
      passwordInput.value = '';
      passwordInput.autocomplete = 'current-password';
      passwordInput.minLength = 0;
      passwordInput.required = false;
      passwordInput.removeAttribute('pattern');
      passwordRequirements.hidden = true;
      button.textContent = 'Sign in';
      modeButton.textContent = 'Create password';
      message.textContent = '';
    }

    function enableAdminSignIn() {
      enableSignIn();
      adminMode = true;
      employeeIdInput.value = 'admin';
      employeeIdInput.readOnly = true;
      heading.textContent = 'Administrator sign in';
      intro.textContent = 'Sign in to manage FLEXDESK administration.';
      button.textContent = 'Sign in as Admin';
      modeButton.hidden = true;
      forgotLink.hidden = true;
      adminModeButton.hidden = true;
      employeeModeButton.hidden = false;
      passwordInput.required = true;
      passwordInput.focus();
    }

    function enableEmployeeSignIn() {
      adminMode = false;
      employeeIdInput.value = '';
      employeeIdInput.readOnly = false;
      heading.textContent = 'Welcome back';
      intro.textContent = 'Sign in to find and manage your workspace.';
      enableSignIn();
      modeButton.hidden = false;
      forgotLink.hidden = false;
      adminModeButton.hidden = false;
      employeeModeButton.hidden = true;
    }

    adminModeButton.addEventListener('click', enableAdminSignIn);
    employeeModeButton.addEventListener('click', enableEmployeeSignIn);

    modeButton.addEventListener('click', () => {
      if (createMode) enableSignIn();
      else enablePasswordCreation();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      message.classList.remove('success');
      button.disabled = true;
      try {
        const employeeId = form.elements.employeeId.value.trim();
        if (employeeId !== 'admin' && !/^[0-9]{5}$/.test(employeeId)) {
          throw new Error('Enter admin or a 5-digit employee ID.');
        }
        if (createMode && !/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,256}$/.test(passwordInput.value)) {
          throw new Error('Password must be at least 8 characters and include an uppercase letter, a lowercase letter, a number and a special character.');
        }
        const credentials = {
          employee_id: employeeId,
          password: passwordInput.value
        };
        if (createMode) {
          if (employeeId === 'admin') throw new Error('The admin account password cannot be changed here.');
          const created = await fetch(`${API}/auth/password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(credentials)
          });
          const result = await created.json();
          if (!created.ok) {
            const detail = typeof result.detail === 'string' ? result.detail : result.detail?.message;
            throw new Error(detail || 'Unable to create password.');
          }
          if (result.access_token) {
            sessionStorage.setItem('flexdesk_token', result.access_token);
            sessionStorage.setItem('flexdesk_user', JSON.stringify(result.user));
            window.location.replace('/');
            return;
          }
          window.location.replace('/login.html?created=1');
          return;
        }
        const response = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(credentials)
        });
        const data = await response.json();
        if (!response.ok) {
          if (response.status === 409 && data.detail?.code === 'password_not_created') {
            enablePasswordCreation();
            return;
          }
          const detail = typeof data.detail === 'string' ? data.detail : data.detail?.message;
          throw new Error(detail || 'Invalid employee ID or password.');
        }
        sessionStorage.setItem('flexdesk_token', data.access_token);
        sessionStorage.setItem('flexdesk_user', JSON.stringify(data.user));
        window.location.replace(data.user.role === 'admin' ? '/admin.html' : '/');
      } catch (cause) {
        message.textContent = cause instanceof Error ? cause.message : 'Unable to sign in. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
